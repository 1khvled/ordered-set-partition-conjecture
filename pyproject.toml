[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ordered-big-blocks"
version = "0.1.0"
description = "Exact computational attack on Alexandersson's ordered big-block conjecture"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-flint==0.9.0",
    "gmpy2==2.3.2",
    "sympy>=1.14",
]

[tool.setuptools]
py-modules = ["scan", "interlace", "frontier", "guess_recurrence", "tp_probe"]
